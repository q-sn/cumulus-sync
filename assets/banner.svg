<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Cumulus: Obsidian sync with pCloud</title>
  <desc id="d">Two-way sync of an Obsidian vault with pCloud on Android, iOS and desktop</desc>
  <defs>
    <path id="cloud" d="M106 186A54 54 0 1 1 155.72 110.92A38 38 0 1 1 164 186Z"/>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="420">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0d0624" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glow)"/>

  <!-- the app icon mark, same geometry as assets/icon.svg -->
  <g transform="translate(141 30) scale(1.35)">
    <g transform="translate(-14 -2)">
    <rect x="62" y="46" width="108" height="140" rx="18" fill="#fff" filter="url(#shadow)"/>
    <path d="M86 84H146M86 108H146M86 132H124" stroke="#a78bfa" stroke-width="11" stroke-linecap="round"/>
    <use href="#cloud" transform="translate(118 116) scale(0.54)" fill="#fff" stroke="url(#bg)" stroke-width="20" paint-order="stroke"/>
    </g>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#fff">
    <text x="500" y="190" font-size="96" font-weight="700" letter-spacing="-2">Cumulus</text>
    <text x="504" y="250" font-size="34" fill="#ede9fe">Sync your Obsidian vault with pCloud</text>
    <text x="504" y="304" font-size="22" fill="#c4b5fd" letter-spacing="0.5">Android  ·  iOS  ·  Windows  ·  macOS  ·  Linux</text>
  </g>
</svg>
